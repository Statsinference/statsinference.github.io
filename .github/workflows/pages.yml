name: Publish StatsArena website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript and result data
        run: |
          node --check assets/app.js
          python3 -c 'import json; d=json.load(open("data/results.json")); assert d["schema_version"] == 1 and isinstance(d["suites"], list)'
      - uses: actions/configure-pages@v5
      - name: Stage only public website files
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets data ate cate contribute-data did iv mediation proximal _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
