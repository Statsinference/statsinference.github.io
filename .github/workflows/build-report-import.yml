name: Build source-reported result update
on:
  push:
    branches: [release/report-import-20261115]
    paths:
      - scripts/import_reports_20261115.py
      - .github/workflows/build-report-import.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply the reviewed one-time source import
        run: |
          python3 scripts/import_reports_20261115.py
          node --check assets/app.js
          node --check assets/release.js
          python3 -m py_compile tests/verify_reported_release.py
      - name: Save generated files on this staging branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/app.js data/results.json
          git commit -m 'build: generate source-faithful domain result tables'
          git push origin HEAD:release/report-import-20261115
          git ls-tree HEAD index.html assets/app.js assets/release.js data/results.json tests/verify_reported_release.py
