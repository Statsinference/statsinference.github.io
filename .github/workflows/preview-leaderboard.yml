name: Validate leaderboard preview
on:
  push:
    branches: [codex/leaderboard-refresh]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scripts and chart calculations
        run: |
          node --check assets/test-view.js
          node --check assets/comparison-charts.js
          node --check assets/domain-illustrations.js
          node tests/verify_log_charts.cjs
      - name: Install browser tests
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify local preview
        env:
          ARENA_TEST_URL: local
        run: python tests/verify_test_view.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leaderboard-preview-check
          path: verification/
          retention-days: 2
